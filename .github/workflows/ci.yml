name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: node --test

      - name: Lint the reference contract
        run: node bin/apicovenant.mjs lint examples/shop.openapi.yaml

      - name: Type check
        run: |
          npm install --no-save typescript@^5.6.0 @types/node@^22.7.0
          npx tsc --noEmit

  self-check:
    name: apicovenant lints its own examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: The reference contract has no findings
        run: node bin/apicovenant.mjs lint examples/shop.openapi.yaml --fail-on info
      - name: The flawed contract is detected
        run: |
          if node bin/apicovenant.mjs lint examples/legacy.openapi.yaml; then
            echo "the legacy example should not pass the linter" >&2
            exit 1
          fi
