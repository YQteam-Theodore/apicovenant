name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install the build toolchain
        run: npm install --no-save typescript@^5.8.0 @types/node@^22.7.0

      - name: Build
        run: npm run build

      - name: Run the test suite
        run: node --test

      - name: Type check
        run: npx tsc --noEmit

      - name: Release check
        run: node scripts/release-check.mjs

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
